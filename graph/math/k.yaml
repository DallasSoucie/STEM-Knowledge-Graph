        encompassing: 0.6
        confidence: high
    knowledge_points:
      - id: kp1
        can_do: Write the numerals 6 to 8 when they are named
        key_prerequisites: [math.k.read-numerals-6-to-10]
      - id: kp2
        can_do: Write the numerals 9 and 10 when they are named
        key_prerequisites: [math.k.read-numerals-6-to-10]
      - id: kp3
