course: math.k
topics:
  - id: math.k.tell-same-different
    name: Telling same from different
    subject: math
    course: math.k
    level: gk
    status: draft
    knowledge_points:
      - id: kp1
        can_do: Find the object that matches a given object
      - id: kp2
        can_do: Say whether two objects are the same or different in color
      - id: kp3
        can_do: Say whether two objects are the same or different in shape or size
      - id: kp4
        can_do: Pick the one object that does not belong in a small group
  - id: math.k.match-one-to-one
    name: Matching objects one to one
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.tell-same-different
        encompassing: 0.25
        confidence: medium
    knowledge_points:
      - id: kp1
        can_do: Give each object in a group exactly one partner from another group
      - id: kp2
        can_do: Tell whether any objects are left without a partner
      - id: kp3
        can_do: Pair up two groups whose objects are spread out
  - id: math.k.sort-by-one-attribute
    name: Sorting objects by one attribute
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.tell-same-different
        encompassing: 0.6
        confidence: high
    knowledge_points:
      - id: kp1
        can_do: Sort objects into two given groups by color
        key_prerequisites: [math.k.tell-same-different]
      - id: kp2
        can_do: Sort objects into two given groups by shape or size
        key_prerequisites: [math.k.tell-same-different]
      - id: kp3
        can_do: Sort objects into three given groups
      - id: kp4
        can_do: Choose an attribute to sort by and say the rule used
  - id: math.k.say-numbers-to-5
    name: Saying number names to 5
    subject: math
    course: math.k
    level: gk
    status: draft
    knowledge_points:
      - id: kp1
        can_do: Say the number names 1 to 3 in order
      - id: kp2
        can_do: Say the number names 1 to 5 in order
      - id: kp3
        can_do: Say which number comes next, up to 5
  - id: math.k.count-objects-to-5
    name: Counting objects to 5
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.match-one-to-one
        encompassing: 0.5
        confidence: high
      - topic: math.k.say-numbers-to-5
        encompassing: 0.9
        confidence: high
    knowledge_points:
      - id: kp1
        can_do: Count up to 3 objects in a line, touching each one once
        key_prerequisites: [math.k.say-numbers-to-5, math.k.match-one-to-one]
      - id: kp2
        can_do: Count up to 5 objects in a line, touching each one once
        key_prerequisites: [math.k.say-numbers-to-5, math.k.match-one-to-one]
      - id: kp3
        can_do: Count up to 5 objects in a circle without counting one twice
        key_prerequisites: [math.k.match-one-to-one]
  - id: math.k.last-count-tells-how-many
    name: Knowing the last number counted tells how many
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.count-objects-to-5
        encompassing: 0.9
        confidence: high
    knowledge_points:
      - id: kp1
        can_do: Answer how many after counting up to 3 objects
        key_prerequisites: [math.k.count-objects-to-5]
      - id: kp2
        can_do: Answer how many after counting up to 5 objects
        key_prerequisites: [math.k.count-objects-to-5]
      - id: kp3
        can_do: Say the amount stays the same when objects are moved around
      - id: kp4
        can_do: Say the amount stays the same when counted from the other end
  - id: math.k.see-small-groups
    name: Seeing small groups without counting
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.last-count-tells-how-many
        encompassing: 0.35
        confidence: medium
    knowledge_points:
      - id: kp1
        can_do: Name a group of 1 to 3 at a glance
        key_prerequisites: [math.k.last-count-tells-how-many]
      - id: kp2
        can_do: Name 4 or 5 dots in a familiar dice pattern at a glance
      - id: kp3
        can_do: Name 4 or 5 objects in a loose arrangement at a glance
  - id: math.k.read-numerals-1-to-5
    name: Reading numerals 1 to 5
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.last-count-tells-how-many
        encompassing: 0.3
        confidence: medium
    knowledge_points:
      - id: kp1
        can_do: Say the name of a written numeral from 1 to 5
      - id: kp2
        can_do: Match a written numeral from 1 to 5 to a group of that size
        key_prerequisites: [math.k.last-count-tells-how-many]
      - id: kp3
        can_do: Pick the numeral that tells how many are in a group
        key_prerequisites: [math.k.last-count-tells-how-many]
  - id: math.k.count-out-to-5
    name: Counting out a given number to 5
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.last-count-tells-how-many
        encompassing: 0.7
        confidence: high
    knowledge_points:
      - id: kp1
        can_do: Take out up to 3 objects when asked
        key_prerequisites: [math.k.last-count-tells-how-many]
      - id: kp2
        can_do: Take out up to 5 objects when asked
        key_prerequisites: [math.k.last-count-tells-how-many]
      - id: kp3
        can_do: Stop at the asked-for number when taking from a larger pile
        key_prerequisites: [math.k.last-count-tells-how-many]
  - id: math.k.zero-as-none
    name: Zero as none
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.last-count-tells-how-many
        encompassing: 0.25
        confidence: medium
    knowledge_points:
      - id: kp1
        can_do: Say zero when a group has no objects
      - id: kp2
        can_do: Match the numeral 0 to an empty group
      - id: kp3
        can_do: Pick the group that has zero from several groups
        key_prerequisites: [math.k.last-count-tells-how-many]
  - id: math.k.write-numerals-0-to-5
    name: Writing numerals 0 to 5
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.read-numerals-1-to-5
        encompassing: 0.5
        confidence: high
      - topic: math.k.zero-as-none
        encompassing: 0.2
        confidence: medium
    knowledge_points:
      - id: kp1
        can_do: Trace the numerals 0 to 5
      - id: kp2
        can_do: Write a numeral from 0 to 5 when it is named
        key_prerequisites: [math.k.read-numerals-1-to-5]
      - id: kp3
        can_do: Write the numeral that tells how many are in a group
        key_prerequisites: [math.k.read-numerals-1-to-5, math.k.zero-as-none]
  - id: math.k.say-numbers-to-10
    name: Saying number names to 10
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
