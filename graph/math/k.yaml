      - id: kp2
        can_do: Say the number names 1 to 10 in order
        key_prerequisites: [math.k.say-numbers-to-5]
      - id: kp3
        can_do: Say which number comes next, up to 10
  - id: math.k.count-line-to-10
    name: Counting objects in a line to 10
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
