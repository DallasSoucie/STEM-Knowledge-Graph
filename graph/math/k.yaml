        key_prerequisites: [math.k.count-line-to-10]
      - id: kp3
        can_do: Tell apart numerals that look alike, such as 6 and 9
  - id: math.k.write-numerals-6-to-10
    name: Writing numerals 6 to 10
    subject: math
    course: math.k
    level: gk
    status: draft
    prerequisites:
      - topic: math.k.write-numerals-0-to-5
