<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge graph map</title>
<style>
/*__STYLE__*/
:root {
  color-scheme: light dark;
  --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b73; --line: #d9d9de; --surface: #f4f4f6;
  --accent: #534AB7;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16161a; --fg: #ececf0; --muted: #9a9aa5; --line: #34343c; --surface: #202026; --accent: #9d97e6; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
#search-wrap { position: relative; flex: 0 1 380px; }
#search { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--fg); font: inherit; }
#results { position: absolute; z-index: 10; left: 0; right: 0; top: 100%; margin-top: 2px; max-height: 60vh;
  overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
#results:empty { display: none; }
#results button { display: block; width: 100%; text-align: left; padding: 6px 10px; border: 0;
  background: none; color: var(--fg); font: inherit; cursor: pointer; }
#results button:hover, #results button:focus { background: var(--surface); }
.sub { display: block; color: var(--muted); font-size: 12px; }
main { flex: 1; display: flex; min-height: 0; }
#map-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#gutter { position: absolute; left: 0; top: 0; bottom: 0; width: 76px; overflow: hidden; border-right: 1px solid var(--line); }
#map { position: absolute; inset: 0 0 0 76px; }
#labels { position: absolute; inset: 0 0 0 76px; overflow: hidden; pointer-events: none; }
#labels span, #gutter span { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.lbl-subject { width: 100%; overflow: hidden; padding: 2px 0 0 6px; border-left: 3px solid; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.lbl-course { padding: 0 3px; height: 16px; line-height: 16px; border-radius: 3px; font-size: 11px; color: var(--fg); background: color-mix(in srgb, var(--bg) 80%, transparent); }
.lbl-level { padding: 0 3px; border-radius: 3px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--bg) 80%, transparent); }
#nowebgl { padding: 24px; color: var(--muted); }
#panel { width: 340px; flex: none; overflow-y: auto; padding: 14px; border-left: 1px solid var(--line); }
#panel h2 { font-size: 16px; margin: 0 0 2px; overflow-wrap: anywhere; }
#panel h3 { font-size: 12px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
#panel .id { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
#panel dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 10px 0 0; }
#panel dt { color: var(--muted); }
#panel dd { margin: 0; }
#panel ul { list-style: none; margin: 0; padding: 0; }
#panel li { margin: 0 0 8px; }
#panel button { padding: 0; border: 0; background: none; color: var(--accent); font: inherit;
  text-align: left; cursor: pointer; text-decoration: underline; }
#panel .meta { color: var(--muted); font-size: 12px; display: block; }
#panel .keys { display: block; font-size: 12px; color: var(--muted); }
.empty-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 16px; pointer-events: none; }
#panel .empty { color: var(--muted); }
#match { margin-left: auto; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
#match-count { font-variant-numeric: tabular-nums; }
#match-count.none { color: #c0392b; font-weight: 600; }
#clear-filters { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  color: var(--fg); font: inherit; cursor: pointer; }
#clear-filters:hover, #clear-filters:focus-visible { border-color: var(--accent); }
#clear-filters[hidden] { display: none; }
#filters { width: 232px; flex: none; overflow-y: auto; padding: 10px 12px; border-right: 1px solid var(--line); font-size: 13px; }
#filters h2 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
#filters h2:first-child { margin-top: 2px; }
#filters fieldset { border: 0; margin: 0 0 6px; padding: 0; min-width: 0; }
#filters legend { padding: 0; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
#filters label { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; overflow-wrap: anywhere; }
#filters .scroll { max-height: 150px; overflow-y: auto; }
#filters .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
#filters .row > label { flex: none; width: 74px; display: block; color: var(--muted); }
#filters select, #filters input[type=number] { flex: 1; min-width: 0; padding: 3px 6px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit; }
#filters .hint { color: var(--muted); font-size: 12px; margin: 2px 0 4px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Knowledge graph map</h1>
  <div id="search-wrap">
    <input id="search" type="search" placeholder="Search topics by name or ID" autocomplete="off" aria-label="Search topics">
    <div id="results"></div>
  </div>
  <div id="match" role="status">
    <span id="match-count"></span>
    <button id="clear-filters" type="button" hidden>Clear filters</button>
  </div>
</header>
<main>
  <aside id="filters" aria-label="Filters">
    <h2>Curriculum</h2>
    <fieldset><legend>Subject</legend><div id="f-subjects"></div></fieldset>
    <fieldset><legend>Course</legend><div id="f-courses" class="scroll"></div></fieldset>
    <div class="row"><label for="f-level-min">Lowest level</label><select id="f-level-min"></select></div>
    <div class="row"><label for="f-level-max">Highest level</label><select id="f-level-max"></select></div>
    <h2>Lineage from selected topic</h2>
    <div id="f-lineage-topic" class="hint"></div>
    <div class="row"><label for="f-direction">Direction</label>
      <select id="f-direction">
        <option value="">Off</option>
        <option value="prerequisites">Prerequisites</option>
        <option value="dependents">Dependents</option>
        <option value="both">Both</option>
      </select></div>
    <div class="row"><label for="f-steps">Step limit</label>
      <input id="f-steps" type="number" min="1" step="1" placeholder="No limit"></div>
    <h2>Review state</h2>
    <fieldset><legend>Status</legend><div id="f-statuses"></div></fieldset>
    <fieldset><legend>Edge confidence</legend><div id="f-confidences"></div></fieldset>
    <label><input id="f-near" type="checkbox"> Near the size limits</label>
  </aside>
  <div id="map-wrap"><div id="gutter"></div><div id="map"></div><div id="labels"></div></div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script type="application/json" id="kg-data">/*__DATA__*/</script>
<script>/*__SIGMA__*/</script>
<script>/*__GRAPHOLOGY__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
