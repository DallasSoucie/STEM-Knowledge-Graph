<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge graph map</title>
<style>
/*__STYLE__*/
:root {
  color-scheme: light dark;
  --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b73; --line: #d9d9de; --surface: #f4f4f6;
  --accent: #534AB7;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16161a; --fg: #ececf0; --muted: #9a9aa5; --line: #34343c; --surface: #202026; --accent: #9d97e6; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
#search-wrap { position: relative; flex: 0 1 380px; }
#search { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--fg); font: inherit; }
#results { position: absolute; z-index: 10; left: 0; right: 0; top: 100%; margin-top: 2px; max-height: 60vh;
  overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
#results:empty { display: none; }
#results button { display: block; width: 100%; text-align: left; padding: 6px 10px; border: 0;
  background: none; color: var(--fg); font: inherit; cursor: pointer; }
#results button:hover, #results button:focus { background: var(--surface); }
.sub { display: block; color: var(--muted); font-size: 12px; }
main { flex: 1; display: flex; min-height: 0; }
#map-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#map { position: absolute; inset: 0; }
#labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#labels span { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.lbl-subject { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.lbl-course { font-size: 11px; color: var(--muted); }
.lbl-level { font-size: 11px; color: var(--muted); }
#nowebgl { padding: 24px; color: var(--muted); }
#panel { width: 340px; flex: none; overflow-y: auto; padding: 14px; border-left: 1px solid var(--line); }
#panel h2 { font-size: 16px; margin: 0 0 2px; overflow-wrap: anywhere; }
#panel h3 { font-size: 12px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
#panel .id { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
#panel dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 10px 0 0; }
#panel dt { color: var(--muted); }
#panel dd { margin: 0; }
#panel ul { list-style: none; margin: 0; padding: 0; }
#panel li { margin: 0 0 8px; }
#panel button { padding: 0; border: 0; background: none; color: var(--accent); font: inherit;
  text-align: left; cursor: pointer; text-decoration: underline; }
#panel .meta { color: var(--muted); font-size: 12px; display: block; }
#panel .keys { display: block; font-size: 12px; color: var(--muted); }
#panel .empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Knowledge graph map</h1>
  <div id="search-wrap">
    <input id="search" type="search" placeholder="Search topics by name or ID" autocomplete="off" aria-label="Search topics">
    <div id="results"></div>
  </div>
</header>
<main>
  <div id="map-wrap"><div id="map"></div><div id="labels"></div></div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script type="application/json" id="kg-data">/*__DATA__*/</script>
<script>/*__SIGMA__*/</script>
<script>/*__GRAPHOLOGY__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
