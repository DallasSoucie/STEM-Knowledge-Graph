[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kg"
version = "0.1.0"
description = "Knowledge graph tooling for STEM learning"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "networkx", "typer", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kg = "kg.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"kg.map" = ["template.html", "app.js", "vendor/*"]
